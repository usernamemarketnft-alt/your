<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>مغيّر الصوت - صوت بنت عراقية</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0f0f1a;color:#fff;font-family:system-ui,-apple-system,Tahoma,sans-serif;min-height:100vh;padding:20px;display:flex;justify-content:center}
.box{width:100%;max-width:460px}
h1{text-align:center;font-size:22px;margin:10px 0 4px}
.sub{text-align:center;color:#9a9ab5;font-size:13px;margin-bottom:18px}
.card{background:#1b1b2e;border:1px solid #2c2c48;border-radius:16px;padding:16px;margin-bottom:14px}
label{display:block;font-size:13px;color:#b8b8d0;margin:10px 0 6px}
input,select{width:100%;padding:12px;border-radius:10px;border:1px solid #34345a;background:#12121f;color:#fff;font-size:15px}
input[type=range]{padding:0}
button{width:100%;padding:14px;border:0;border-radius:12px;font-size:16px;font-weight:700;color:#fff;cursor:pointer;margin-top:10px}
.rec{background:#e63e6d}
.rec.on{background:#c0121f;animation:p 1s infinite}
.go{background:#7c5cff}
.dl{background:#1fa86b;display:block;text-align:center;text-decoration:none;padding:14px;border-radius:12px;font-weight:700;margin-top:10px;color:#fff}
.sm{background:#2c2c48;font-size:13px;padding:10px}
button:disabled{opacity:.5}
audio{width:100%;margin-top:10px}
textarea{width:100%;padding:12px;border-radius:10px;border:1px solid #34345a;background:#12121f;color:#fff;font-size:15px;min-height:90px;resize:vertical;font-family:inherit}
.or{text-align:center;color:#9a9ab5;font-size:13px;margin-top:14px}
.tts{background:#e68a00}
.des{background:#2a9d8f}
.pvw{background:#12121f;border:1px solid #34345a;border-radius:12px;padding:10px;margin-top:10px}
.pvw button{margin-top:8px;padding:10px;font-size:14px;background:#1fa86b}
#st{text-align:center;font-size:14px;color:#ffd166;min-height:20px;margin:6px 0}
.hide{display:none}
@keyframes p{50%{opacity:.6}}
</style>
</head>
<body>
<div class="box">
  <h1>🎙️ مغيّر الصوت</h1>
  <div class="sub">سجّل صوتك → يتحول لصوت بنت عراقية</div>

  <div class="card">
    <label>طريقة التحويل</label>
    <select id="mode">
      <option value="ai">ذكاء صناعي (ElevenLabs) - صوت بنت حقيقي ✨</option>
      <option value="free">مجاني داخل المتصفح (تغيير نبرة فقط)</option>
    </select>

    <div id="aiBox">
      <label>مفتاح ElevenLabs API</label>
      <input id="key" type="password" placeholder="sk_...">
      <button class="sm" id="loadV">📥 تحميل أصوات البنات</button>
      <label>صوت البنت</label>
      <select id="voice"><option value="EXAVITQu4vr4xnSDxMaL">Sarah (افتراضي)</option></select>
    </div>

    <div id="freeBox">
      <label>رفع النبرة (0 = بدون): <span id="pv">0</span></label>
      <input id="pitch" type="range" min="0" max="9" step="0.5" value="0">
      <label>نعومة الصوت (0 = بدون): <span id="sv">4</span></label>
      <input id="soft" type="range" min="0" max="10" step="1" value="4">
    </div>
  </div>

  <div class="card">
    <b>🎨 اصنع صوت بنت عراقية</b>
    <label>وصف الصوت (انجليزي أدق)</label>
    <textarea id="dsc">A young Iraqi Arabic woman in her mid-20s, speaking natural Baghdadi Iraqi dialect. Warm, soft and clear voice, relaxed and conversational like a real person talking to a friend, natural breathing and small pauses, expressive, not robotic and not an announcer.</textarea>
    <button class="des" id="dsgBtn">✨ أنشئ 3 نماذج</button>
    <div id="dst" style="text-align:center;font-size:14px;color:#ffd166;margin-top:6px"></div>
    <div id="prevs"></div>
  </div>

  <div class="card">
    <button class="rec" id="recBtn">⏺ ابدأ التسجيل</button>
    <audio id="orig" controls class="hide"></audio>
    <button class="go" id="goBtn" disabled>🔄 حوّل لصوت بنت</button>
    <div class="or">— أو اكتب نص وحوّله لصوت بنت —</div>
    <label>النص (اكتبه بلهجتك)</label>
    <textarea id="txt" placeholder="اكتب هنا..."></textarea>
    <label>نموذج النطق</label>
    <select id="model">
      <option value="eleven_v3">Eleven v3 - الأفضل للعربي ✨</option>
      <option value="eleven_multilingual_v2">Multilingual v2</option>
    </select>
    <label>الثبات (أقل = أكثر تعبيراً وطبيعية)</label>
    <select id="stab">
      <option value="0.5">طبيعي (افتراضي)</option>
      <option value="0">تعبيري أكثر</option>
      <option value="1">ثابت</option>
    </select>
    <button class="tts" id="ttsBtn">🔊 حوّل النص لصوت</button>
    <div id="st"></div>
    <audio id="out" controls class="hide"></audio>
    <a id="dl" class="dl hide" download="girl-voice.mp3">⬇️ تحميل الصوت</a>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
<script>
const $=id=>document.getElementById(id);
let mr,chunks=[],blob=null,recording=false;
const st=t=>$('st').textContent=t;

// حفظ الإعدادات
try{
  $('key').value=localStorage.getItem('el_key')||'';
  const sv=localStorage.getItem('el_voice'); if(sv) $('voice').dataset.saved=sv;
}catch(e){}

$('mode').onchange=()=>{
  const ai=$('mode').value==='ai';
  $('aiBox').classList.toggle('hide',!ai);
  $('pitch').value=ai?0:5;$('pv').textContent=ai?0:5;
  $('soft').value=ai?4:6;$('sv').textContent=ai?4:6;
};
$('pitch').oninput=e=>$('pv').textContent=e.target.value;
$('soft').oninput=e=>$('sv').textContent=e.target.value;

// تحميل أصوات البنات من ElevenLabs
$('loadV').onclick=async()=>{
  const k=$('key').value.trim();
  if(!k){st('⚠️ حط المفتاح أول');return}
  try{
    st('جاري تحميل الأصوات...');
    const r=await fetch('https://api.elevenlabs.io/v1/voices',{headers:{'xi-api-key':k}});
    if(!r.ok) throw new Error(await r.text());
    const d=await r.json();
    const fem=d.voices.filter(v=>(v.labels&&v.labels.gender==='female')||v.category!=='premade');
    const list=fem.length?fem:d.voices;
    $('voice').innerHTML=list.map(v=>`<option value="${v.voice_id}">${v.name}${v.labels&&v.labels.accent?' - '+v.labels.accent:''}</option>`).join('');
    localStorage.setItem('el_key',k);
    st('✅ تم تحميل '+list.length+' صوت');
  }catch(e){st('❌ '+String(e.message).slice(0,150))}
};

// التسجيل
$('recBtn').onclick=async()=>{
  if(!recording){
    try{
      const s=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});
      chunks=[];mr=new MediaRecorder(s);
      mr.ondataavailable=e=>e.data.size&&chunks.push(e.data);
      mr.onstop=()=>{
        s.getTracks().forEach(t=>t.stop());
        blob=new Blob(chunks,{type:mr.mimeType||'audio/webm'});
        $('orig').src=URL.createObjectURL(blob);
        $('orig').classList.remove('hide');
        $('goBtn').disabled=false;
        st('تم التسجيل ✅ اضغط تحويل');
      };
      mr.start();recording=true;
      $('recBtn').textContent='⏹ إيقاف التسجيل';
      $('recBtn').classList.add('on');
      st('🎙️ جاري التسجيل...');
    }catch(e){st('❌ ما كدرت أوصل للمايك: '+e.message)}
  }else{
    mr.stop();recording=false;
    $('recBtn').textContent='⏺ سجّل من جديد';
    $('recBtn').classList.remove('on');
  }
};

// تحويل WAV
function toWav(buf){
  const ch=buf.getChannelData(0),n=ch.length,sr=buf.sampleRate;
  const a=new ArrayBuffer(44+n*2),v=new DataView(a);
  const w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};
  w(0,'RIFF');v.setUint32(4,36+n*2,true);w(8,'WAVEfmt ');
  v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
  v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);
  w(36,'data');v.setUint32(40,n*2,true);
  for(let i=0;i<n;i++){const s=Math.max(-1,Math.min(1,ch[i]));v.setInt16(44+i*2,s<0?s*0x8000:s*0x7fff,true)}
  return new Blob([a],{type:'audio/wav'});
}

function show(b,ext){
  const u=URL.createObjectURL(b);
  $('out').src=u;$('out').classList.remove('hide');
  $('dl').href=u;$('dl').download='girl-voice.'+ext;$('dl').classList.remove('hide');
  $('out').play().catch(()=>{});
}

// رفع النبرة + نعومة (للوضعين)
async function pitchProcess(arr,pitch,soft){
  await Tone.start();
  const ctx=new (window.AudioContext||window.webkitAudioContext)();
  const buf=await ctx.decodeAudioData(arr);
  const res=await Tone.Offline(()=>{
    const n=[];
    if(pitch>0) n.push(new Tone.PitchShift({pitch:pitch,windowSize:0.06}));
    if(soft>0){
      n.push(new Tone.Filter({type:'highpass',frequency:110}));
      n.push(new Tone.Filter({type:'lowshelf',frequency:260,gain:-soft*1.3}));
      n.push(new Tone.Filter({type:'peaking',frequency:3200,Q:0.7,gain:soft*0.5}));
      n.push(new Tone.Filter({type:'highshelf',frequency:6500,gain:-soft*0.5}));
      n.push(new Tone.Compressor({threshold:-26,ratio:3,attack:0.01,release:0.15}));
      n.push(new Tone.Gain(1+soft*0.1));
    }
    const p=new Tone.Player(buf);
    p.chain(...n,Tone.getDestination());
    p.start(0);
  },buf.duration+0.3);
  return toWav(res.get());
}
async function freeConvert(){
  show(await pitchProcess(await blob.arrayBuffer(),parseFloat($('pitch').value),parseFloat($('soft').value)),'wav');
}

// وضع الذكاء الصناعي
async function aiConvert(){
  const k=$('key').value.trim();
  if(!k) throw new Error('حط مفتاح ElevenLabs');
  const ext=blob.type.includes('mp4')?'m4a':blob.type.includes('ogg')?'ogg':'webm';
  const fd=new FormData();
  fd.append('audio',blob,'rec.'+ext);
  fd.append('model_id','eleven_multilingual_sts_v2');
  fd.append('voice_settings',JSON.stringify({stability:0.5,similarity_boost:0.8}));
  fd.append('remove_background_noise','true');
  const r=await fetch('https://api.elevenlabs.io/v1/speech-to-speech/'+$('voice').value+'?output_format=mp3_44100_128',{
    method:'POST',headers:{'xi-api-key':k},body:fd
  });
  if(!r.ok) throw new Error((await r.text()).slice(0,200));
  try{localStorage.setItem('el_key',k)}catch(e){}
  const out=await r.blob(),pv=parseFloat($('pitch').value),sv=parseFloat($('soft').value);
  if(pv>0||sv>0) show(await pitchProcess(await out.arrayBuffer(),pv,sv),'wav'); else show(out,'mp3');
}

const dst=t=>$('dst').textContent=t;
$('dsgBtn').onclick=async()=>{
  const k=$('key').value.trim(),d=$('dsc').value.trim();
  if(!k){$('aiBox').classList.remove('hide');dst('⚠️ حط مفتاح ElevenLabs أول');return}
  if(d.length<20){dst('⚠️ الوصف قصير');return}
  $('dsgBtn').disabled=true;dst('⏳ جاري إنشاء النماذج (ياخذ شوية)...');$('prevs').innerHTML='';
  try{
    const r=await fetch('https://api.elevenlabs.io/v1/text-to-voice/design',{
      method:'POST',headers:{'xi-api-key':k,'Content-Type':'application/json'},
      body:JSON.stringify({voice_description:d,auto_generate_text:true})
    });
    if(!r.ok) throw new Error((await r.text()).slice(0,200));
    try{localStorage.setItem('el_key',k)}catch(e){}
    const j=await r.json();
    j.previews.forEach((p,i)=>{
      const box=document.createElement('div');box.className='pvw';
      const a=document.createElement('audio');a.controls=true;a.src='data:audio/mpeg;base64,'+p.audio_base_64;
      const b=document.createElement('button');b.textContent='✅ احفظ النموذج '+(i+1)+' واستعمله';
      b.onclick=async()=>{
        b.disabled=true;dst('⏳ جاري الحفظ...');
        try{
          const rr=await fetch('https://api.elevenlabs.io/v1/text-to-voice',{
            method:'POST',headers:{'xi-api-key':k,'Content-Type':'application/json'},
            body:JSON.stringify({voice_name:'Iraqi Girl '+(i+1),voice_description:d,generated_voice_id:p.generated_voice_id})
          });
          if(!rr.ok) throw new Error((await rr.text()).slice(0,200));
          const v=await rr.json();
          $('voice').add(new Option('Iraqi Girl '+(i+1),v.voice_id),0);
          $('voice').value=v.voice_id;
          dst('✅ انحفظ وصار هو الصوت المختار');
        }catch(e){dst('❌ '+e.message);b.disabled=false}
      };
      box.append(a,b);$('prevs').append(box);
    });
    dst('اسمع النماذج واختار الأحسن');
  }catch(e){dst('❌ '+e.message)}
  $('dsgBtn').disabled=false;
};

$('ttsBtn').onclick=async()=>{
  const t=$('txt').value.trim(),k=$('key').value.trim();
  if(!t){st('⚠️ اكتب النص أول');return}
  if(!k){$('aiBox').classList.remove('hide');st('⚠️ حط مفتاح ElevenLabs');return}
  $('ttsBtn').disabled=true;st('⏳ جاري إنشاء الصوت...');
  try{
    const r=await fetch('https://api.elevenlabs.io/v1/text-to-speech/'+$('voice').value+'?output_format=mp3_44100_128',{
      method:'POST',headers:{'xi-api-key':k,'Content-Type':'application/json'},
      body:JSON.stringify({text:t,model_id:$('model').value,voice_settings:{stability:parseFloat($('stab').value),similarity_boost:0.8}})
    });
    if(!r.ok) throw new Error((await r.text()).slice(0,200));
    try{localStorage.setItem('el_key',k)}catch(e){}
    const out=await r.blob(),pv=parseFloat($('pitch').value),sv=parseFloat($('soft').value);
    show(out,'mp3');
    st('✅ خلص!');
  }catch(e){st('❌ '+e.message)}
  $('ttsBtn').disabled=false;
};

$('goBtn').onclick=async()=>{
  if(!blob)return;
  $('goBtn').disabled=true;st('⏳ جاري التحويل...');
  try{
    if($('mode').value==='ai') await aiConvert(); else await freeConvert();
    st('✅ خلص!');
  }catch(e){st('❌ '+e.message)}
  $('goBtn').disabled=false;
};
</script>
</body>
</html>
