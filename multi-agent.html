<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>فريق الوكلاء</title>
<style>
  :root{--bg:#0f1220;--card:#181c30;--line:#2a3050;--txt:#e8eaf6;--mut:#8b92b8;--acc:#6c8cff;--ok:#34d399;--warn:#fbbf24;--bad:#f87171}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;line-height:1.7}
  .wrap{max-width:720px;margin:0 auto;padding:16px}
  h1{font-size:20px;margin:6px 0 2px}
  .sub{color:var(--mut);font-size:13px;margin-bottom:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
  textarea,input,select{width:100%;background:#10142a;color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit}
  textarea{min-height:110px;resize:vertical}
  label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
  .row{display:flex;gap:10px}.row>div{flex:1}
  button{width:100%;margin-top:12px;background:var(--acc);color:#fff;border:0;border-radius:10px;padding:12px;font:inherit;font-weight:600;cursor:pointer}
  button.stop{background:var(--bad);display:none}
  button:disabled{opacity:.5}
  .msg{border-right:3px solid var(--acc);padding:8px 12px;margin-bottom:10px;background:#141832;border-radius:8px}
  .msg .who{font-weight:700;font-size:14px;margin-bottom:4px}
  .msg .rd{color:var(--mut);font-weight:400;font-size:12px;margin-right:6px}
  .msg .body{white-space:pre-wrap;font-size:14px;word-break:break-word}
  .judge{border-right-color:var(--warn)}.judge.ok{border-right-color:var(--ok)}
  .err{border-right-color:var(--bad);color:var(--bad)}
  .status{color:var(--mut);font-size:13px;text-align:center;margin:8px 0}
  .final{border:1px solid var(--ok);background:#0f2a22}
  .final h2{margin:0 0 8px;font-size:16px;color:var(--ok)}
  .final .body{white-space:pre-wrap;font-size:14px;word-break:break-word}
  .small{font-size:12px;color:var(--mut)}
  .copy{background:#223;margin-top:10px;padding:8px;font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <h1>🤝 فريق وكلاء الذكاء الاصطناعي</h1>
  <div class="sub">مخطط + محلل + منفذ + ناقد يتناقشون ومحكّم يقرر، والمُلخّص يطلّع الحل النهائي.</div>

  <div class="card">
    <label>المشكلة المعقدة</label>
    <textarea id="problem" placeholder="اكتب المشكلة هنا..."></textarea>

    <div class="row">
      <div>
        <label>عدد الجولات</label>
        <select id="rounds">
          <option value="1">1</option><option value="2" selected>2</option>
          <option value="3">3</option><option value="4">4</option>
          <option value="5">5</option><option value="6">6</option>
        </select>
      </div>
      <div>
        <label>النموذج</label>
        <input id="model" list="models" value="gemini-3.8-flash" autocomplete="off" dir="ltr"><datalist id="models"><option value="gemini-3.1-flash-lite"><option value="gemini-3.8-flash"><option value="gemini-3.6-flash"></datalist>
      </div>
    </div>

    <label>مفتاح Gemini API (مجاني من aistudio.google.com/apikey)</label>
    <input id="key" type="password" placeholder="AIza..." autocomplete="off" dir="ltr">

    <button id="go">ابدأ النقاش</button>
    <button id="stop" class="stop">⏹ إيقاف</button>
    <div class="small" style="margin-top:8px">المفتاح يتخزن بجهازك فقط (localStorage) ويُرسل مباشرة لـ Google. لا تنشر الصفحة بمفتاحك داخلها.</div>
  </div>

  <div id="out"></div>
</div>

<script>
const API_BASE = "https://generativelanguage.googleapis.com/v1beta/models/";
const MAX_TRANSCRIPT_CHARS = 14000;
const $ = id => document.getElementById(id);
const out = $("out");

const AGENTS = [
  { name: "المخطط", icon: "🧭",
    system: "انت وكيل اسمه 'المخطط' ضمن فريق ذكاء اصطناعي يحل مشاكل معقدة. مهمتك: تقسّم المشكلة لأجزاء واضحة، وتحدد الأهداف والقيود، وترتب الخطوات." },
  { name: "المحلل", icon: "🔍",
    system: "انت وكيل اسمه 'المحلل' ضمن فريق ذكاء اصطناعي يحل مشاكل معقدة. مهمتك: تحلل المشكلة بعمق، تطرح الخيارات والبدائل، وتذكر الحقائق والافتراضات والمقارنات بين الحلول." },
  { name: "المنفذ", icon: "🛠️",
    system: "انت وكيل اسمه 'المنفذ' ضمن فريق ذكاء اصطناعي يحل مشاكل معقدة. مهمتك: تحول الأفكار لحل عملي قابل للتنفيذ: خطوات محددة، أو كود، أو تصميم، وتصحح حلك حسب ملاحظات الفريق." },
  { name: "الناقد", icon: "⚔️",
    system: "انت وكيل اسمه 'الناقد' ضمن فريق ذكاء اصطناعي يحل مشاكل معقدة. مهمتك: تدور على الثغرات والأخطاء والمخاطر والافتراضات الضعيفة بكلام الفريق، وتعترض بوضوح مع السبب، وإذا شيء صحيح تعترف بيه وما تعارض بس للمعارضة." }
];

const JUDGE_SYSTEM = "انت 'المحكّم' ضمن فريق ذكاء اصطناعي. تقرأ نقاش الفريق وتقرر هل وصلوا لحل متفق عليه وخالي من اعتراضات جوهرية. رد بـ JSON فقط بدون أي نص ثاني وبهذا الشكل:\n{\"consensus\": true أو false, \"reason\": \"سبب قصير\", \"open_issues\": [\"نقطة مفتوحة\"]}";
const SYNTH_SYSTEM = "انت 'المُلخّص' ضمن فريق ذكاء اصطناعي. تاخذ نقاش الفريق كله وتكتب الحل النهائي المتكامل: واضح، منظم، عملي، ويراعي اعتراضات الناقد. اذكر بالنهاية أي مخاطر أو نقاط لازم ينتبه لها المستخدم.";
const LANG_RULE = "اكتب بنفس لغة المشكلة (إذا المشكلة عربية اكتب بالعربية الواضحة). خليك مباشر ومختصر.";

try {
  $("key").value = localStorage.getItem("ma_gkey") || "";
  $("model").value = localStorage.getItem("ma_gmodel2") || "gemini-3.8-flash";
} catch (e) {}

let controller = null;
let statusEl = null;

/* ---------- واجهة ---------- */
function add(cls, who, rd, text) {
  const d = document.createElement("div");
  d.className = "msg " + cls;
  if (who) {
    const w = document.createElement("div");
    w.className = "who";
    w.textContent = who;
    if (rd) {
      const s = document.createElement("span");
      s.className = "rd";
      s.textContent = "جولة " + rd;
      w.appendChild(s);
    }
    d.appendChild(w);
  }
  const b = document.createElement("div");
  b.className = "body";
  b.textContent = text;
  d.appendChild(b);
  out.appendChild(d);
  d.scrollIntoView({ behavior: "smooth", block: "end" });
}

function setStatus(t) {
  if (!statusEl) { statusEl = document.createElement("div"); statusEl.className = "status"; }
  statusEl.textContent = "⏳ " + t;
  out.appendChild(statusEl);
  statusEl.scrollIntoView({ behavior: "smooth", block: "end" });
}
function clearStatus() {
  if (statusEl && statusEl.parentNode) statusEl.parentNode.removeChild(statusEl);
}

function showFinal(text) {
  const d = document.createElement("div");
  d.className = "card final";
  const h = document.createElement("h2");
  h.textContent = "✅ الحل النهائي";
  const b = document.createElement("div");
  b.className = "body";
  b.textContent = text;
  const c = document.createElement("button");
  c.className = "copy";
  c.textContent = "📋 نسخ الحل";
  c.onclick = async () => {
    try { await navigator.clipboard.writeText(text); c.textContent = "تم النسخ ✔"; }
    catch (e) { c.textContent = "ما اشتغل النسخ، انسخ يدوياً"; }
  };
  d.appendChild(h); d.appendChild(b); d.appendChild(c);
  out.appendChild(d);
  d.scrollIntoView({ behavior: "smooth", block: "start" });
}

/* ---------- API ---------- */
const sleep = ms => new Promise(r => setTimeout(r, ms));
let useThinkingCfg = true;
let workingModel = "";

function addLive(who, rd) {
  const d = document.createElement("div");
  d.className = "msg";
  const w = document.createElement("div");
  w.className = "who";
  w.textContent = who;
  const s = document.createElement("span");
  s.className = "rd";
  s.textContent = "جولة " + rd;
  w.appendChild(s);
  const b = document.createElement("div");
  b.className = "body";
  d.appendChild(w); d.appendChild(b);
  out.appendChild(d);
  d.scrollIntoView({ behavior: "smooth", block: "end" });
  return b;
}

function partsText(data) {
  const cand = (data.candidates || [])[0];
  const parts = (cand && cand.content && cand.content.parts) || [];
  return parts.filter(p => !p.thought).map(p => p.text || "").join("");
}

async function callLLM(system, user, maxTokens, key, model, signal, onChunk) {
  const stream = typeof onChunk === "function";
  const chain = [...new Set([workingModel || model, model, "gemini-3.1-flash-lite", "gemini-3.6-flash", "gemini-3.8-flash"])];
  let ci = 0;
  const urlFor = m => API_BASE + encodeURIComponent(m) +
    (stream ? ":streamGenerateContent?alt=sse" : ":generateContent");

  for (let attempt = 0; attempt < 12; attempt++) {
    const url = urlFor(chain[ci]);
    const cfg = { maxOutputTokens: maxTokens * 4, temperature: 0.7 };
    if (useThinkingCfg) cfg.thinkingConfig = { thinkingLevel: "low" };
    let res;
    try {
      res = await fetch(url, {
        method: "POST",
        signal,
        headers: { "x-goog-api-key": key, "content-type": "application/json" },
        body: JSON.stringify({
          systemInstruction: { parts: [{ text: system }] },
          contents: [{ role: "user", parts: [{ text: user }] }],
          generationConfig: cfg
        })
      });
    } catch (e) {
      if (e.name === "AbortError") throw e;
      if (attempt < 5) {
        setStatus("الاتصال انقطع، أعيد المحاولة... (" + (attempt + 1) + "/5)");
        await sleep(3000 * (attempt + 1));
        continue;
      }
      throw new Error("ما اشتغل الاتصال بـ Google. تأكد من الإنترنت (أو أطفي VPN) وجرب مرة ثانية.");
    }

    if (!res.ok) {
      let detail = "";
      try { const j = await res.json(); detail = (j.error && j.error.message) || JSON.stringify(j); }
      catch (e) { detail = ""; }
      if (res.status === 400 && useThinkingCfg && /think/i.test(detail)) {
        useThinkingCfg = false;   // النموذج ما يدعم هذا الإعداد، نعيد بدونه
        continue;
      }
      if ([500, 502, 503, 504].includes(res.status) && attempt < 5) {
        const w = 4 * (attempt + 1);
        setStatus("سيرفر Google مشغول، أعيد المحاولة بعد " + w + " ثانية... (" + (attempt + 1) + "/5)");
        await sleep(w * 1000);
        continue;
      }
      if ((res.status === 429 || res.status === 404) && ci < chain.length - 1) {
        ci++;
        setStatus("النموذج السابق مو متاح/مشغول، أجرب " + chain[ci] + "...");
        continue;
      }
      if (res.status === 429 && attempt < 11) {
        const w = 15 + 5 * Math.min(attempt, 6);
        setStatus("كل النماذج وصلت الحد المجاني، أنتظر " + w + " ثانية...");
        await sleep(w * 1000);
        ci = 0;
        continue;
      }
      throw new Error("خطأ API (" + res.status + "): " + detail);
    }

    let text = "";
    let reason = "";
    try {
    if (stream) {
      const reader = res.body.getReader();
      const dec = new TextDecoder();
      let buf = "";
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        const lines = buf.split("\n");
        buf = lines.pop();
        for (const ln of lines) {
          if (!ln.startsWith("data:")) continue;
          const js = ln.slice(5).trim();
          if (!js) continue;
          try {
            const data = JSON.parse(js);
            const t = partsText(data);
            if (t) { text += t; onChunk(text); }
            const c = (data.candidates || [])[0];
            if (c && c.finishReason) reason = c.finishReason;
            if (data.promptFeedback && data.promptFeedback.blockReason) reason = data.promptFeedback.blockReason;
          } catch (e) {}
        }
      }
    } else {
      const data = await res.json();
      text = partsText(data);
      const c = (data.candidates || [])[0];
      reason = (data.promptFeedback && data.promptFeedback.blockReason) || (c && c.finishReason) || "";
    }
    } catch (e) {
      if (e.name === "AbortError") throw e;
      if (attempt < 5) {
        setStatus("انقطع البث، أعيد المحاولة... (" + (attempt + 1) + "/5)");
        await sleep(3000 * (attempt + 1));
        continue;
      }
      throw new Error("انقطع الاتصال أثناء الرد. جرب مرة ثانية.");
    }
    text = text.trim();
    workingModel = chain[ci];
    if (!text) throw new Error("النموذج ما رجّع رد (" + (reason || "رد فارغ") + ")");
    return text;
  }
}

function parseJSON(t) {
  try { return JSON.parse(t.slice(t.indexOf("{"), t.lastIndexOf("}") + 1)); }
  catch (e) { return {}; }
}

function fmt(transcript) {
  if (!transcript.length) return "(النقاش لسه ما بدأ)";
  let full = transcript.map(x => "[" + x[0] + "]: " + x[1]).join("\n\n");
  if (full.length > MAX_TRANSCRIPT_CHARS)
    full = "...(تم اختصار بداية النقاش)...\n" + full.slice(-MAX_TRANSCRIPT_CHARS);
  return full;
}

/* ---------- محرك النقاش ---------- */
const TEAM_SYSTEM = "انت فريق ذكاء اصطناعي من 5 أدوار يحل مشاكل معقدة. بكل رد تكتب مساهمة كل دور بالترتيب، وكل دور بحدود 100 كلمة:\n" +
  "## المخطط\nيقسّم المشكلة لأجزاء ويحدد الأهداف والقيود ويرتب الخطوات.\n" +
  "## المحلل\nيحلل بعمق، يطرح الخيارات والبدائل والحقائق والافتراضات والمقارنات.\n" +
  "## المنفذ\nيحول الأفكار لحل عملي قابل للتنفيذ: خطوات محددة أو كود أو تصميم.\n" +
  "## الناقد\nيدور على الثغرات والمخاطر والافتراضات الضعيفة ويعترض بوضوح مع السبب، وإذا شي صحيح يعترف بيه.\n" +
  "## المحكّم\nيقرر هل وصل الفريق لحل متفق عليه بدون اعتراضات جوهرية. بسطر أخير بالضبط: الاتفاق: نعم  أو  الاتفاق: لا\n" +
  "التزم بعناوين الأدوار بالضبط كما هي (## ثم الاسم) وبنفس الترتيب، وكل دور يقرأ اللي قبله ويرد عليه.";

const ROLE_ICONS = { "المخطط": "🧭", "المحلل": "🔍", "المنفذ": "🛠️", "الناقد": "⚔️", "المحكّم": "⚖️" };

function parseTeam(text) {
  const re = /^\s*##\s*(المخطط|المحلل|المنفذ|الناقد|المحكّم|المحكم)\s*$/m;
  const lines = text.split("\n");
  const parts = [];
  let cur = null;
  for (const ln of lines) {
    const m = ln.match(/^\s*#{1,3}\s*(المخطط|المحلل|المنفذ|الناقد|المحكّم|المحكم)\s*:?\s*$/);
    if (m) { cur = { name: m[1] === "المحكم" ? "المحكّم" : m[1], text: "" }; parts.push(cur); }
    else if (cur) cur.text += ln + "\n";
  }
  parts.forEach(p => p.text = p.text.trim());
  return parts.filter(p => p.text);
}

async function runDebate(problem, rounds, key, model, signal) {
  const transcript = [];

  for (let rnd = 1; rnd <= rounds; rnd++) {
    setStatus("الجولة " + rnd + " من " + rounds + " — الفريق يناقش...");
    const task = rnd === 1
      ? "هذي أول جولة. اكتب مساهمة كل الأدوار."
      : "هذي جولة رقم " + rnd + ". كل دور يرد على الاعتراضات والنقاط المفتوحة من النقاش السابق ويحسّن أو يدافع.";
    let live = null;
    const raw = await callLLM(
      TEAM_SYSTEM,
      "المشكلة:\n" + problem + "\n\nنقاش الفريق لحد الآن:\n" + fmt(transcript) +
        "\n\n" + task + "\n" + LANG_RULE,
      1500, key, model, signal,
      t => {
        if (!live) { clearStatus(); live = addLive("👥 الفريق يكتب...", rnd); }
        live.textContent = t;
      }
    );
    clearStatus();
    if (live) { const m = live.parentNode; if (m && m.parentNode) m.parentNode.removeChild(m); }

    const parts = parseTeam(raw);
    let consensus = false;
    if (!parts.length) {
      add("", "👥 الفريق", rnd, raw);
      transcript.push(["الفريق", raw]);
    } else {
      for (const part of parts) {
        if (part.name === "المحكّم") {
          const mm = part.text.match(/الاتفاق\s*[:：]\s*(نعم|لا)/);
          consensus = !!(mm && mm[1] === "نعم");
          const shown = part.text.replace(/\n?\s*الاتفاق\s*[:：]\s*(نعم|لا)\s*$/, "").trim();
          add("judge" + (consensus ? " ok" : ""), "⚖️ المحكّم", rnd,
            (consensus ? "✅ وصلوا لاتفاق: " : "🔄 لسه ماكو اتفاق: ") + shown);
          transcript.push(["المحكّم", "اتفاق=" + (consensus ? "نعم" : "لا") + ". " + shown]);
        } else {
          add("", (ROLE_ICONS[part.name] || "") + " " + part.name, rnd, part.text);
          transcript.push([part.name, part.text]);
        }
      }
    }
    if (consensus && rnd >= 2) break;
  }

  setStatus("المُلخّص يكتب الحل النهائي...");
  let finalLive = null;
  const final = await callLLM(
    SYNTH_SYSTEM,
    "المشكلة:\n" + problem + "\n\nنقاش الفريق الكامل:\n" + fmt(transcript) +
      "\n\nاكتب الحل النهائي المتكامل.\n" + LANG_RULE,
    2000, key, model, signal,
    t => {
      if (!finalLive) { clearStatus(); finalLive = addLive("✍️ المُلخّص", "أخيرة"); }
      finalLive.textContent = t;
    }
  );
  clearStatus();
  if (finalLive) { const m = finalLive.parentNode; if (m && m.parentNode) m.parentNode.removeChild(m); }
  showFinal(final);
}

/* ---------- أزرار ---------- */
$("go").onclick = async () => {
  const problem = $("problem").value.trim();
  const key = $("key").value.trim();
  const model = $("model").value.trim() || "gemini-3.8-flash";
  const rounds = parseInt($("rounds").value) || 2;

  if (!problem) { alert("اكتب المشكلة أول"); return; }
  if (!key) { alert("حط مفتاح API أول"); return; }
  try { localStorage.setItem("ma_gkey", key); localStorage.setItem("ma_gmodel2", model); } catch (e) {}

  out.innerHTML = "";
  statusEl = null;
  $("go").disabled = true;
  $("stop").style.display = "block";
  controller = new AbortController();

  try {
    await runDebate(problem, rounds, key, model, controller.signal);
  } catch (e) {
    clearStatus();
    if (e.name === "AbortError") add("err", "⏹ توقف", 0, "تم إيقاف النقاش.");
    else add("err", "⚠️ خطأ", 0, String(e.message || e));
  }

  clearStatus();
  $("go").disabled = false;
  $("stop").style.display = "none";
  controller = null;
};

$("stop").onclick = () => { if (controller) controller.abort(); };
</script>
</body>
</html>
